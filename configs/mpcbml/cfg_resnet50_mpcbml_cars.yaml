MODEL:
  BACKBONE:
    NAME: resnet50
  PRETRAIN: imagenet

SAVE_DIR: output-resnet50-cars196-mpcbml

INPUT:
  MODE: 'RGB'
  PIXEL_MEAN: [0.485, 0.456, 0.406]
  PIXEL_STD: [0.229, 0.224, 0.225]

SOLVER:
  MAX_ITERS: 5000
  STEPS: [1200]
  OPTIMIZER_NAME: Adam
  BASE_LR: 0.00003
  LAMBDA_LR: 0.0001
  WARMUP_ITERS: 0
  WEIGHT_DECAY: 0.0005

LOSSES:
  NAME: 'mpcbml_loss'
  MPCBML_LOSS:
    INIT_METHOD: 'random'
    N_CLASSES: 98
    PROTOTYPE_PER_CLASS: 3
    GAMMA_REG: 0.2
    LAMBDA_REG: 1.0
    THETA_IS_LEARNABLE: False
    INIT_THETA: 1.0

DATA:
  TRAIN_IMG_SOURCE: resource/datasets/Cars196/train.txt
  TEST_IMG_SOURCE: resource/datasets/Cars196/test.txt
  CLASS_COUNT_SOURCE: resource/datasets/Cars196/class_counts.json
  TRAIN_BATCHSIZE: 120
  TEST_BATCHSIZE: 128
  NUM_WORKERS: 8
  NUM_INSTANCES: 8

VALIDATION:
  VERBOSE: 200
