MODEL:
  BACKBONE:
    NAME: mobilenet_v3_small
  PRETRAIN: output-mobilenet-cub-mpcbml/best_model.pth

SAVE_DIR: output-mobilenet-cub-mpcbml

INPUT:
  MODE: 'RGB'
  PIXEL_MEAN: [0.485, 0.456, 0.406]
  PIXEL_STD: [0.229, 0.224, 0.225]
  FLIP_PROB: 0.5
  ORIGIN_SIZE: 160
  CROP_SCALE: [0.2, 1.0]
  CROP_SIZE: 144

SOLVER:
  MAX_ITERS: 5000
  STEPS: [4000]
  OPTIMIZER_NAME: Adam
  BASE_LR: 0.0001
  WARMUP_ITERS: 0
  WEIGHT_DECAY: 0.0005
  WEIGHT_LR: 0.00003
  WEIGHT_MOMENTUM: 0.0

LOSSES:
  NAME: 'mpcbml_loss'
  MPCBML_LOSS:
    INIT_METHOD: 'kmeans'
    N_CLASSES: 100
    PROTOTYPE_PER_CLASS: 5
    GAMMA_REG: 0.3
    LAMBDA_REG: 1.5
    THETA_IS_LEARNABLE: False
    INIT_THETA: 0.7

DATA:
  TRAIN_IMG_SOURCE: resource/datasets/CUB_200_2011/train.txt
  TEST_IMG_SOURCE: resource/datasets/CUB_200_2011/test.txt
  CLASS_COUNT_SOURCE: resource/datasets/CUB_200_2011/class_counts.json
  TRAIN_BATCHSIZE: 32
  TEST_BATCHSIZE: 64
  NUM_WORKERS: 4
  NUM_INSTANCES: 4

VALIDATION:
  VERBOSE: 200