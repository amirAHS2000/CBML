MODEL:
  BACKBONE:
    NAME: resnet18
  PRETRAIN: imagenet

SAVE_DIR: output-resnet18-cub-mpcbml

INPUT:
  MODE: 'RGB'
  PIXEL_MEAN: [0.485, 0.456, 0.406]
  PIXEL_STD: [0.229, 0.224, 0.225]

SOLVER:
  MAX_ITERS: 5000
  STEPS: [1200]
  OPTIMIZER_NAME: Adam
  BASE_LR: 3e-4
  WARMUP_ITERS: 0
  WEIGHT_DECAY: 0.0005
  WEIGHT_LR: 0.0003
  WEIGHT_MOMENTUM: 0.0

LOSSES:
  NAME: 'mpcbml_loss'
  MPCBML_LOSS:
    INIT_METHOD: 'kmeans'
    N_CLASSES: 100
    PROTOTYPE_PER_CLASS: 3
    THETA_IS_LEARNABLE: True
    INIT_THETA: 2.5
    
DATA:
  TRAIN_IMG_SOURCE: resource/datasets/CUB_200_2011/train.txt
  TEST_IMG_SOURCE: resource/datasets/CUB_200_2011/test.txt
  CLASS_COUNT_SOURCE: resource/datasets/CUB_200_2011/class_counts.json
  TRAIN_BATCHSIZE: 64
  TEST_BATCHSIZE: 64
  NUM_WORKERS: 8
  NUM_INSTANCES: 8

VALIDATION:
  VERBOSE: 200