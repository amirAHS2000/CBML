MODEL:
  BACKBONE:
    NAME: resnet18
  PRETRAIN: imagenet

SAVE_DIR: output-resnet18-cub-mpcbml

INPUT:
  MODE: 'RGB'
  PIXEL_MEAN: [0.485, 0.456, 0.406]
  PIXEL_STD: [0.229, 0.224, 0.225]

SOLVER:
  MAX_ITERS: 9150
  STEPS: [3660, 7320]
  OPTIMIZER_NAME: Adam
  BASE_LR: 0.0001
  LAMBDA_LR: 0.0001
  WARMUP_ITERS: 300
  WARMUP_FACTOR: 0.1
  WEIGHT_DECAY: 0.0005
  WEIGHT_LR: 0.005
  WEIGHT_MOMENTUM: 0.0

LOSSES:
  NAME: 'mpcbml_loss'
  MPCBML_LOSS:
    INIT_METHOD: 'random'
    N_CLASSES: 100
    PROTOTYPE_PER_CLASS: 3
    GAMMA_REG: 0.1
    LAMBDA_REG: 0.1
    THETA_IS_LEARNABLE: False
    INIT_THETA: 1.0
    
DATA:
  TRAIN_IMG_SOURCE: resource/datasets/CUB_200_2011/train.txt
  TEST_IMG_SOURCE: resource/datasets/CUB_200_2011/test.txt
  CLASS_COUNT_SOURCE: resource/datasets/CUB_200_2011/class_counts.json
  TRAIN_BATCHSIZE: 32
  TEST_BATCHSIZE: 128
  NUM_WORKERS: 8
  NUM_INSTANCES: 8

VALIDATION:
  VERBOSE: 200