MODEL:
  BACKBONE:
    NAME: googlenet
  PRETRAIN: imagenet

SAVE_DIR: output-googlenet-cub

INPUT:
   MODE: 'RGB'
   PIXEL_MEAN: [0.485, 0.456, 0.406]
   PIXEL_STD: [0.229, 0.224, 0.225]

SOLVER:
  MAX_ITERS: 5000
  STEPS: [4000]
  OPTIMIZER_NAME: Adam
  BASE_LR: 0.0001
  WARMUP_ITERS: 0
  WEIGHT_DECAY: 0.0005
  WEIGHT_LR: 0.00003
  WEIGHT_MOMENTUM: 0.0

LOSSES:
  NAME: 'mpcbml_loss'
  MPCBML_LOSS:
    INIT_METHOD: 'kmeans'
    N_CLASSES: 100
    PROTOTYPE_PER_CLASS: 5
    GAMMA_REG: 0.2
    LAMBDA_REG: 0.3
    THETA_IS_LEARNABLE: False
    INIT_THETA: 0.7

DATA:
  TRAIN_IMG_SOURCE: resource/datasets/CUB_200_2011/train.txt
  TEST_IMG_SOURCE: resource/datasets/CUB_200_2011/test.txt
  TRAIN_BATCHSIZE: 64
  TEST_BATCHSIZE: 128
  NUM_WORKERS: 8
  NUM_INSTANCES: 8

VALIDATION:
  VERBOSE: 200
