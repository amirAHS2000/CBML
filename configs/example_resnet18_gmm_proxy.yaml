# previous_works.pdf multi-prototype Gaussian mixture posterior, ResNet-18 / CUB / 64-D.
# All numerical optimizer/precision initial values are explicit experimental choices;
# the manuscript specifies the forms, not these starting hyperparameters.
MODEL:
  BACKBONE:
    NAME: resnet18
  PRETRAIN: imagenet
  HEAD:
    NAME: linear_norm
    DIM: 64
SAVE_DIR: output-resnet18-cub-gmm-proxy
INPUT:
  MODE: RGB
  PIXEL_MEAN: [0.485, 0.456, 0.406]
  PIXEL_STD: [0.229, 0.224, 0.225]
SOLVER:
  MAX_ITERS: 5000
  STEPS: [1200]
  OPTIMIZER_NAME: Adam
  BASE_LR: 0.00003
  WARMUP_ITERS: 0
  WEIGHT_DECAY: 0.0005
  CHECKPOINT_PERIOD: 200
LOSSES:
  NAME: gmm_proxy_loss
  NAME_AUX: ''
  GMM_PROXY_LOSS:
    NUM_CLASSES: 0
    K: 3
    BETA_INIT: 10.0
    BETA_LR: 0.0001
    PROXY_LR: 0.01
    WEIGHT_LR: 0.001
    WEIGHT_FLOOR: 0.0001
    INIT_METHOD: kmeans
DATA:
  TRAIN_IMG_SOURCE: resource/datasets/CUB_200_2011/train.txt
  TEST_IMG_SOURCE: resource/datasets/CUB_200_2011/test.txt
  TRAIN_BATCHSIZE: 120
  TEST_BATCHSIZE: 128
  NUM_WORKERS: 8
  NUM_INSTANCES: 8
VALIDATION:
  VERBOSE: 200
DIAGNOSTICS:
  ENABLED: true
  STATS_EVERY: 20
  TRAIN_RECALL: true
  TRAIN_RECALL_EVERY: 200
  FINAL_EVAL: true
  FAST_RECALL: false
  INSTANCE_GEOMETRY: true
