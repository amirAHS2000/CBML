MODEL:
  BACKBONE:
    NAME: resnet50
  PRETRAIN: output-resnet50-cars196-mp-cbml/model_005000.pth

SAVE_DIR: output-resnet50-cars196-mp-cbml

INPUT:
  MODE: 'RGB'
  PIXEL_MEAN: [0.485, 0.456, 0.406]
  PIXEL_STD: [0.229, 0.224, 0.225]

SOLVER:
  MAX_ITERS: 5000
  STEPS: [1200]
  OPTIMIZER_NAME: Adam
  BASE_LR: 0.00003
  WARMUP_ITERS: 0
  WEIGHT_DECAY: 0.0005

LOSSES:
  NAME: 'multi_prototype_cbml'
  MULTI_PROTOTYPE_CBML:
    INIT_METHOD: 'kmeans'
    N_CLASSES: 196
    PROTOTYPE_PER_CLASS: 4
    HYPER_WEIGHT: 0.1
    REG_WEIGHT: 1.0

DATA:
  TRAIN_IMG_SOURCE: resource/datasets/cars196/train.txt
  TEST_IMG_SOURCE: resource/datasets/cars196/test.txt
  TRAIN_BATCHSIZE: 120
  TEST_BATCHSIZE: 128
  NUM_WORKERS: 8
  NUM_INSTANCES: 8

VALIDATION:
  VERBOSE: 200
