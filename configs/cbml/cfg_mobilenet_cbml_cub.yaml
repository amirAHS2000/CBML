MODEL:
  BACKBONE:
    NAME: mobilenet_v3_small
  PRETRAIN: imagenet

SAVE_DIR: output-mobilenet-cub-cbml

INPUT:
  MODE: 'RGB'
  PIXEL_MEAN: [0.485, 0.456, 0.406]
  PIXEL_STD: [0.229, 0.224, 0.225]
  FLIP_PROB: 0.5
  ORIGIN_SIZE: 160
  CROP_SCALE: [0.2, 1.0]
  CROP_SIZE: 144

SOLVER:
  MAX_ITERS: 5000
  STEPS: [1200]
  OPTIMIZER_NAME: Adam
  BASE_LR: 0.0001
  WARMUP_ITERS: 0
  WEIGHT_DECAY: 0.0005
  BACKBONE_LR_MULT: 0.2
  HEAD_LR_MULT: 1.0

LOSSES:
  NAME: 'cbml_loss'
  CBML_LOSS:
    POS_A: 0.5
    POS_B: 0.5
    NEG_A: 1.0
    NEG_B: 0.01
    MARGIN: 0.1
    HYPER_WEIGHT: 0.2
  
DATA:
  TRAIN_IMG_SOURCE: resource/datasets/CUB_200_2011/train.txt
  TEST_IMG_SOURCE: resource/datasets/CUB_200_2011/test.txt
  CLASS_COUNT_SOURCE: resource/datasets/CUB_200_2011/class_counts.json
  TRAIN_BATCHSIZE: 32
  TEST_BATCHSIZE: 64
  NUM_WORKERS: 4
  NUM_INSTANCES: 4

VALIDATION:
  VERBOSE: 200
