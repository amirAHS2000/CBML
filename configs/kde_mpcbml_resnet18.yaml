MODEL:
  BACKBONE:
    NAME: resnet18
  PRETRAIN: imagenet
  HEAD:
    DIM: 64

SAVE_DIR: output-resnet50-cub

INPUT:
   MODE: 'RGB'
   PIXEL_MEAN: [0.485, 0.456, 0.406]
   PIXEL_STD: [0.229, 0.224, 0.225]

SOLVER:
  MAX_ITERS: 2000
  STEPS: [1500]
  OPTIMIZER_NAME: Adam
  BASE_LR: 0.0003
  WARMUP_ITERS: 0
  WEIGHT_DECAY: 0.0005
  PROTO_LR_MUL: 10
  PROTO_REINIT_ITER: 400

LOSSES:
  CBML_LOSS:
    POS_A: 0.95
    POS_B: 0.02
    NEG_A: 0.95
    NEG_B: 0.02
    MARGIN: 0.1
    HYPER_WEIGHT: 0.2
    WEIGHT: 1.5
    INIT_METHOD: 'kmeans'
    N_CLASSES: 100
    PROTOTYPE_PER_CLASS: 3

DATA:
  TRAIN_IMG_SOURCE: resource/datasets/CUB_200_2011/train.txt
  TEST_IMG_SOURCE: resource/datasets/CUB_200_2011/test.txt
  TRAIN_BATCHSIZE: 64
  TEST_BATCHSIZE: 128
  NUM_WORKERS: 8
  NUM_INSTANCES: 8

VALIDATION:
  VERBOSE: 200
